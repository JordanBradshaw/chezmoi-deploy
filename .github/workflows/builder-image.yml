name: builder-image

on:
  push:
    branches: [main]
    paths:
      - 'features/src/zsh-builder/**'
      - 'features/builder/**'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: features/builder/x86_64.Dockerfile
          push: true
          tags: |
            ghcr.io/jordanbradshaw/zsh-builder:latest
            ghcr.io/jordanbradshaw/zsh-builder:sha-${{ steps.sha.outputs.short }}
